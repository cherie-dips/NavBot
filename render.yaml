# NavBot on Render — Blueprint (adjust service names / connect your Git repo in the dashboard).
# Docs: https://render.com/docs/blueprint-spec
#
# Post-deploy:
# - Set CORS_ORIGIN on navbot-auth AND navbot-api to your static site origin (comma-separated for multiple).
#   navbot-auth uses it for session cookies; navbot-api uses it to restrict the /api/sites dashboard
#   routes only — the public widget/chat routes stay open to any origin regardless.
# - Set BETTER_AUTH_URL (or BETTER_AUTH_BASE_URL) on navbot-auth to this service’s public URL (e.g. https://navbot-auth.onrender.com).
# - Set BETTER_AUTH_SECRET on navbot-auth (long random string; used to sign sessions — required in production).
# - Set NAVBOT_API_TOKEN_SECRET to the SAME long random string on BOTH navbot-auth and navbot-api —
#   required in production. navbot-auth mints a short-lived token after verifying a real session;
#   navbot-api verifies it instead of trusting a client-supplied userId. Without it, every
#   dashboard request that needs to prove who the caller is fails.
# - Optional: SENTRY_DSN on navbot-auth and navbot-api for error tracking (a no-op until set).
# - Set VITE_API_URL, VITE_AUTH_URL, VITE_WIDGET_SCRIPT_URL on the static site (e.g. widget URL = https://<static-host>/chat-widget.iife.js).
# - Widget script is served with Access-Control-Allow-Origin: * so it can load from GitHub Pages etc. (avoid crossorigin="anonymous" on <script> unless you need SRI).
# - Secrets on navbot-api: PINECONE_*, GEMINI_API_KEY (chat, STT, TTS), SERPER_API_KEY (social + live site search).
# - Google *login* (OAuth): set GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET on navbot-auth (not on the API).
#   Google Cloud Console → APIs & Services → Credentials → OAuth 2.0 Client ID (type: Web application).
#   Authorized redirect URIs — must match exactly (https, no trailing slash on the host):
#     https://<your-navbot-auth-host>/api/auth/callback/google
#   Example: https://navbot-auth.onrender.com/api/auth/callback/google
#   Use the auth service URL (same value as BETTER_AUTH_URL), NOT the static web site URL.
#   Authorized JavaScript origins: your static site origin only, e.g. https://navbot-web.onrender.com
# - Optional: GITHUB_CLIENT_ID + GITHUB_CLIENT_SECRET on navbot-auth for GitHub login.
# - API uses Docker (apps/api/Dockerfile) with Playwright + Chromium for SPA crawling.
# - NAVBOT_BROWSER_CRAWL=auto by default — uses Playwright for detected SPAs (React, Vue, Angular, etc.).

services:
  - type: web
    name: navbot-auth
    runtime: node
    rootDir: .
    buildCommand: NODE_ENV=development pnpm install && pnpm --filter server build
    startCommand: NODE_ENV=production pnpm --filter server start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Optional: explicit static site URL for OAuth error redirects (defaults to first CORS_ORIGIN).
      - key: WEB_APP_ORIGIN
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Must be the exact same value as NAVBOT_API_TOKEN_SECRET on navbot-api.
      - key: NAVBOT_API_TOKEN_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: navbot-api
    runtime: docker
    rootDir: .
    dockerfilePath: ./apps/api/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NAVBOT_BROWSER_CRAWL
        value: "auto"
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      # Signs visitor session tokens for the daily question limit. Without it each
      # instance uses a random secret, so limits reset on deploy and differ per instance.
      - key: NAVBOT_SESSION_SECRET
        sync: false
      # Must be the exact same value as NAVBOT_API_TOKEN_SECRET on navbot-auth — required in
      # production. Verifies dashboard requests actually come from the logged-in user they
      # claim to; without it every /api/sites dashboard route rejects all requests.
      - key: NAVBOT_API_TOKEN_SECRET
        sync: false
      # Dashboard origin allowed to call the /api/sites dashboard routes (same value as on navbot-auth).
      - key: CORS_ORIGIN
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Optional. Defaults: reasoning on, live search on judgement + weak-retrieval turns.
      - key: NAVBOT_REASONING
        sync: false
      - key: NAVBOT_WEB_MODE
        sync: false

  - type: web
    name: navbot-web
    runtime: static
    rootDir: .
    buildCommand: NODE_ENV=development pnpm install && pnpm --filter @repo/chat-widget build && pnpm --filter web build
    staticPublishPath: ./apps/web/dist
    headers:
      - path: /chat-widget.iife.js
        name: Access-Control-Allow-Origin
        value: "*"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        sync: false
      - key: VITE_AUTH_URL
        sync: false
      - key: VITE_WIDGET_SCRIPT_URL
        sync: false
