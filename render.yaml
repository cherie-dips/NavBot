# NavBot on Render — Blueprint (adjust service names / connect your Git repo in the dashboard).
# Docs: https://render.com/docs/blueprint-spec
#
# Post-deploy:
# - Set CORS_ORIGIN on navbot-auth to your static site origin (comma-separated for multiple).
# - Set BETTER_AUTH_URL (or BETTER_AUTH_BASE_URL) on navbot-auth to this service’s public URL (e.g. https://navbot-auth.onrender.com).
# - Set BETTER_AUTH_SECRET on navbot-auth (long random string; used to sign sessions — required in production).
# - Set VITE_API_URL, VITE_AUTH_URL, VITE_WIDGET_SCRIPT_URL on the static site (e.g. widget URL = https://<static-host>/chat-widget.iife.js).
# - Widget script is served with Access-Control-Allow-Origin: * so it can load from GitHub Pages etc. (avoid crossorigin="anonymous" on <script> unless you need SRI).
# - Secrets: PINECONE_* on navbot-api; GOOGLE_API_KEY (Gemini) on navbot-api only.
# - Google *login* (OAuth): set GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET on navbot-auth (not on the API).
#   Google Cloud Console → APIs & Services → Credentials → OAuth 2.0 Client ID (type: Web application).
#   Authorized redirect URIs — must match exactly (https, no trailing slash on the host):
#     https://<your-navbot-auth-host>/api/auth/callback/google
#   Example: https://navbot-auth.onrender.com/api/auth/callback/google
#   Use the auth service URL (same value as BETTER_AUTH_URL), NOT the static web site URL.
#   Authorized JavaScript origins: your static site origin only, e.g. https://navbot-web.onrender.com
# - Optional: GITHUB_CLIENT_ID + GITHUB_CLIENT_SECRET on navbot-auth for GitHub login.
# - Native API uses NAVBOT_BROWSER_CRAWL=off by default. For Playwright crawling on Render, deploy the API with
#   Docker using apps/api/Dockerfile (see file header) instead of the Node native service below.
# - Do NOT set NODE_ENV=production as a service env var: Render injects it during *build*, and pnpm then skips
#   devDependencies (TypeScript, @types/node). Production mode is set only in startCommand below.

databases:
  - name: navbot-db
    databaseName: navbot
    user: navbot
    plan: free

services:
  - type: web
    name: navbot-auth
    runtime: node
    rootDir: .
    buildCommand: NODE_ENV=development pnpm install && pnpm --filter server build
    startCommand: NODE_ENV=production pnpm --filter server start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: navbot-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      # Optional: explicit static site URL for OAuth error redirects (defaults to first CORS_ORIGIN).
      - key: WEB_APP_ORIGIN
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  - type: web
    name: navbot-api
    runtime: node
    rootDir: .
    buildCommand: NODE_ENV=development pnpm install && pnpm --filter @repo/color-extractor build && pnpm --filter api build
    startCommand: NODE_ENV=production pnpm --filter api start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: navbot-db
          property: connectionString
      - key: NAVBOT_BROWSER_CRAWL
        value: "off"
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

  - type: web
    name: navbot-web
    runtime: static
    rootDir: .
    buildCommand: NODE_ENV=development pnpm install && pnpm --filter @repo/chat-widget build && pnpm --filter web build
    staticPublishPath: ./apps/web/dist
    headers:
      - path: /chat-widget.iife.js
        name: Access-Control-Allow-Origin
        value: "*"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        sync: false
      - key: VITE_AUTH_URL
        sync: false
      - key: VITE_WIDGET_SCRIPT_URL
        sync: false
